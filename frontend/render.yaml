services:
  - type: web
    name: fitness-ai-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      # SPA client-side routing (React Router): unmatched paths fall back to
      # index.html so refreshing e.g. /trainer/dashboard doesn't 404.
      - type: rewrite
        source: /*
        destination: /index.html
