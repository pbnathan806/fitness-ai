services:
  - type: web
    name: fitness-ai-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements/base.txt
    startCommand: alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: POSTGRES_HOST
        sync: false
      - key: POSTGRES_PORT
        sync: false
      - key: POSTGRES_USER
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
      - key: POSTGRES_DB
        sync: false
      - key: POSTGRES_SSL_MODE
        value: require
      - key: DATABASE_POOL_MIN_SIZE
        value: "1"
      - key: DATABASE_POOL_MAX_SIZE
        value: "10"
      - key: JWT_SECRET_KEY
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: PASSWORD_RESET_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: "Fitness AI Platform <noreply@limitedeals.com>"
      - key: FRONTEND_BASE_URL
        value: "https://fitness-ai-frontend-c6bs.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: ENVIRONMENT
        value: production
